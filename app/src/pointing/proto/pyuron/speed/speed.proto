syntax = "proto3";

package pyuron.speed;

// Runtime state of the Pyuron trackball speed multiplier.
message SpeedInfo {
    uint32 percent = 1;         // cursor speed multiplier in percent (100 = x1.0)
    bool   accel_on = 2;        // mouse acceleration on/off
    uint32 accel_strength = 3;  // acceleration strength 0..100 (only when accel_on)
}

message GetRequest {}
message SetRequest {
    uint32 percent = 1;
    bool   accel_on = 2;
    uint32 accel_strength = 3;
}

message Request {
    oneof request_type {
        GetRequest get = 1;
        SetRequest set = 2;
    }
}

message ErrorResponse { string message = 1; }

message Response {
    oneof response_type {
        ErrorResponse error = 1;
        SpeedInfo     info  = 2;
    }
}
