syntax = "proto3";

package pyuron.tapdance;

// Live editing of fixed tap-dance slots (&ptd0..&ptd3). Only the contents live
// in RAM/NVS. See app/src/behaviors/behavior_tap_dance.c
// (CONFIG_PYURON_TAPDANCE_STUDIO_RPC).
//
// behavior_id is a ZMK behavior local id. 0 = &none. steps[k] = behavior for
// (k+1) taps. tapping_term_ms is shared across all counts of the slot.

message TapDanceStep {
    uint32 behavior_id = 1;
    int32 param1 = 2;
    int32 param2 = 3;
}

message TapDanceInfo {
    uint32 id = 1;                    // slot 0..3
    uint32 tapping_term_ms = 2;
    uint32 count_len = 3;             // valid count 1..4
    repeated TapDanceStep steps = 4;  // max_count:4 (steps[k] = (k+1)-tap behavior)
}

message GetCountRequest {}
message GetCountResponse { uint32 count = 1; }

message GetRequest { uint32 id = 1; }
message GetResponse { TapDanceInfo info = 1; }

message SetStepRequest {
    uint32 id = 1;
    uint32 index = 2;
    uint32 behavior_id = 3;
    int32 param1 = 4;
    int32 param2 = 5;
}
message SetStepResponse { TapDanceInfo info = 1; }

message SetTermRequest { uint32 id = 1; uint32 tapping_term_ms = 2; }
message SetTermResponse { TapDanceInfo info = 1; }

message SetLenRequest { uint32 id = 1; uint32 len = 2; }
message SetLenResponse { TapDanceInfo info = 1; }

message ClearRequest { uint32 id = 1; }
message ClearResponse { TapDanceInfo info = 1; }

message Request {
    oneof request_type {
        GetCountRequest get_count = 1;
        GetRequest get = 2;
        SetStepRequest set_step = 3;
        SetTermRequest set_term = 4;
        SetLenRequest set_len = 5;
        ClearRequest clear = 6;
    }
}

message ErrorResponse { string message = 1; }

message Response {
    oneof response_type {
        ErrorResponse error = 1;
        GetCountResponse get_count = 2;
        GetResponse get = 3;
        SetStepResponse set_step = 4;
        SetTermResponse set_term = 5;
        SetLenResponse set_len = 6;
        ClearResponse clear = 7;
    }
}
