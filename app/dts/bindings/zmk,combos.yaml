description: Combos container

compatible: "zmk,combos"

child-binding:
  description: "A combo"

  properties:
    bindings:
      type: phandle-array
      required: true
    key-positions:
      type: array
      required: true
    timeout-ms:
      type: int
      default: 50
    require-prior-idle-ms:
      type: int
      default: -1
    slow-release:
      type: boolean
    layers:
      type: array
    pyuron-combo-slot:
      type: int
      description: |
        Pyuron live-editing slot index (0..5). When set and
        CONFIG_PYURON_COMBO_STUDIO_RPC is enabled, this combo's key positions,
        fire behavior, timeout and layer mask are taken from the RAM/NVS mirror
        for that slot (and start disabled until configured), so they can be
        edited at runtime from the desktop app.
